name: mock_app_dates
description: Mock app flow that drives the react-calendar-like date picker (group + click_until)
start_url: "{app_url}"
variables:
  app_url: {required: true, description: "URL of the mock app"}
settings:
  default_timeout_ms: 3000
  slow_mo_ms: 0
  amount_decimal_separator: ","
login:
  logged_in_selector: group_header
selectors:
  group_header: "[data-testid=group-header]"
  add_expense_button: "role=button[name=/add expense/i]"
  expense_dialog: 'role=dialog[name="New expense"]'
  title_input: "input[name=title]"
  amount_input: "input[name=amount]"
  save_button: "role=button[name=Save]"
  date_button: '[class*="ExpenseInfo__DatePickerButton"]'
  date_dialog: 'role=dialog[name="Choose date"]'
  prev_month_button: 'role=dialog >> .react-calendar__navigation__prev-button'
  next_month_button: 'role=dialog >> .react-calendar__navigation__next-button'
  day_tile: 'role=dialog >> button:has(> abbr[aria-label="{transaction.day} {transaction.month_name} {transaction.year}"])'
  today_tile: 'role=dialog >> button:has(> abbr[aria-label="{today.day} {today.month_name} {today.year}"])'
  date_ok_button: 'role=dialog >> role=button[name="OK"]'
  member_amount: 'li:has-text("{p}") input.member-amount'
setup: []
per_transaction:
  - click: add_expense_button
  - wait_for: expense_dialog
  - fill: {target: title_input, value: "{transaction.name}"}
  - fill: {target: amount_input, value: "{transaction.amount}"}
  - for_each:
      items: transaction.participants
      as: p
      steps:
        - fill: {target: member_amount, value: "{p_amount}"}
  - group:
      when: "{transaction.date_iso}"
      steps:
        - click: date_button
        - wait_for: date_dialog
        # The picker may reopen on the previously chosen month: first return to today's month.
        - click_until: {target: next_month_button, until: today_tile, max: 36, delay_ms: 20}
        - click_until: {target: prev_month_button, until: day_tile, max: 36, delay_ms: 20}
        - click: day_tile
        - click: date_ok_button
        - wait_for: {target: date_dialog, state: hidden}
  - group:
      when: "{transaction.no_date}"
      steps:
        - click: date_button
        - wait_for: date_dialog
        - click_until: {target: next_month_button, until: today_tile, max: 36, delay_ms: 20}
        - click: today_tile
        - click: date_ok_button
        - wait_for: {target: date_dialog, state: hidden}
  - click: save_button
    commit: true
  - wait_for: {target: expense_dialog, state: hidden}
    commit: true
dry_run_cleanup:
  - click: '#cancel-btn'
  - wait_for: {target: expense_dialog, state: hidden}
