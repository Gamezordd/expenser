name: mock_stages
description: Mock app flow with group_picker and members stages (file:// pages)
start_url: "{app_url}"
variables:
  app_url: {required: true, description: "URL of the mock app"}
  lists_url: {required: true, description: "URL of the mock lists page"}
  list_id: {required: true, description: "Group id (chosen by the picker)"}
settings:
  default_timeout_ms: 3000
  slow_mo_ms: 0
  amount_decimal_separator: ","
  date_format: "%d-%m-%Y"
login:
  logged_in_selector: group_header
group_picker:
  url: "{lists_url}"
  items: 'a[href*="/lists/"]'
  value_attribute: href
  value_regex: '/lists/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})'
  label: 'h1, h2, h3, h4, h5'
  variable: list_id
  wait_for: 'a[href*="/lists/"]'
members:
  url: "{app_url}?list={list_id}"
  items: '#member-dropdown select option'
  me: '#member-dropdown select option:checked'
selectors:
  group_header: "[data-testid=group-header]"
  add_expense_button: "role=button[name=/add expense/i]"
  expense_dialog: "role=dialog"
  title_input: "input[name=title]"
  amount_input: "input[name=amount]"
  paid_by_select: "select[name=paid_by]"
  date_input: "input[name=date]"
  member_checkbox: 'label:has-text("{p}") >> input[type=checkbox]'
  cancel_button: "role=button[name=Cancel]"
  save_button: "role=button[name=Save]"
  member_amount: 'li:has-text("{p}") input.member-amount'
setup: []
per_transaction:
  - click: add_expense_button
  - wait_for: expense_dialog
  - fill: {target: title_input, value: "{transaction.name}"}
  - fill: {target: amount_input, value: "{transaction.amount}"}
  - select: {target: paid_by_select, label: "{transaction.paid_by}"}
    when: "{transaction.paid_by}"
  - for_each:
      items: transaction.participants
      as: p
      steps:
        - fill: {target: member_amount, value: "{p_amount}"}
  - for_each:
      items: transaction.excluded_participants
      as: p
      steps:
        - uncheck: member_checkbox
  - click: save_button
    commit: true
  - wait_for: {target: expense_dialog, state: hidden}
    commit: true
dry_run_cleanup:
  - click: cancel_button
  - wait_for: {target: expense_dialog, state: hidden}
